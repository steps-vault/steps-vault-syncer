packages:
  - packages/*
  - apps/*

# A package version must be at least 7 days old before pnpm installs it: poisoned releases are usually found and
# pulled within days.
minimumReleaseAge: 10080

# Install scripts run only for these, by name: esbuild fetches its platform binary, Electron downloads its runtime.
# electron-winstaller (pulled in by electron-builder) is for Squirrel installers; we build NSIS, so it never runs.
allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
