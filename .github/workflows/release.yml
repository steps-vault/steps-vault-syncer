# Builds StepsVault Sync for Windows in public CI and, once SignPath is set up, signs and publishes it (docs/releasing.md).
# Signing happens twice because Smart App Control checks both: first every program inside the app, then the installer
# made from the signed app. Without SignPath the workflow still builds an unsigned installer as a test artifact, but it
# never publishes anything unsigned.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-app:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      app-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: The tag must match the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match the app version $version in apps/desktop/package.json."; exit 1; }
      - name: Package the app (no installer yet)
        working-directory: apps/desktop
        run: |
          node scripts/build.mjs
          pnpm exec electron-builder --win --dir --publish never
      - id: upload-app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: app-unsigned
          path: apps/desktop/release/win-unpacked/
          retention-days: 7

  sign-app:
    needs: package-app
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627  # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app-folder
          github-artifact-id: ${{ needs.package-app.outputs.app-artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: app-signed
          path: signed-app/
          retention-days: 7

  build-installer:
    needs: [package-app, sign-app]
    # Runs after signing, or straight after packaging when SignPath isn't set up (a test build that is never published).
    if: always() && needs.package-app.result == 'success' && needs.sign-app.result != 'failure' && needs.sign-app.result != 'cancelled'
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      installer-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.sign-app.result == 'success' && 'app-signed' || 'app-unsigned' }}
          path: apps/desktop/release/app
      - name: Build the installer from the (signed) app
        working-directory: apps/desktop
        run: pnpm exec electron-builder --win nsis --prepackaged release/app --publish never
      - id: upload-installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ needs.sign-app.result == 'success' && 'installer' || 'test-build-unsigned' }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml
          retention-days: 7

  sign-installer-and-publish:
    needs: [sign-app, build-installer]
    if: startsWith(github.ref, 'refs/tags/v') && needs.sign-app.result == 'success' && needs.build-installer.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627  # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ needs.build-installer.outputs.installer-artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release
      - name: Point the update manifest at the signed installer, and write checksums
        shell: bash
        run: |
          node apps/desktop/scripts/refresh-latest-yml.mjs release
          (cd release && sha256sum *.exe > SHA256SUMS.txt)
      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.exe release/latest.yml release/SHA256SUMS.txt --title "StepsVault Sync $GITHUB_REF_NAME" --generate-notes
